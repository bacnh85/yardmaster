# yardmaster config — copy to config.yaml and fill in your keys.
listen: ":8787"
db_path: "yardmaster.db"
# retention_days: 7          # prune requests older than N days (hourly); 0/absent = keep forever
admin_password: "change-me"        # dashboard + admin API

providers:
  # --- DeepSeek (models: deepseek-flash = V4.1-Flash, deepseek-v4-pro) ---
  # 1M context / 384K max output; vision on flash only. Context caching is
  # automatic — leave inject_cache_control off. Live prepaid balance shows in
  # the dashboard Quota tab.
  - name: deepseek
    base_url: https://api.deepseek.com
    wire: openai
    auth: { type: static, keys: ["sk-..."] }
    models: [deepseek-flash, deepseek-v4-pro]
  # DeepSeek also serves the anthropic and responses wires from the same key —
  # byte-exact passthrough for Claude Code / Codex clients (dashboard preset adds these):
  # - name: deepseek-claude
  #   base_url: https://api.deepseek.com/anthropic
  #   wire: anthropic
  #   auth: { type: static, keys: ["sk-..."] }
  #   models: [deepseek-flash, deepseek-v4-pro]
  # - name: deepseek-gpt
  #   base_url: https://api.deepseek.com
  #   wire: responses
  #   auth: { type: static, keys: ["sk-..."] }
  #   models: [deepseek-flash, deepseek-v4-pro]

  # --- Z.ai GLM Coding Plan (Anthropic wire; maximizes subscription usage) ---
  # Coding-plan models: GLM-5.3 (1M ctx, text-only, reasoning low/high/max) and
  # GLM-5.3-Flash (multimodal, 3x plan quota). glm-5.2/5.1 auto-route to 5.3.
  # Credits = (input*6.9 + cached*1.7 + output*24)/10k (flash: 2.3/0.56/8) —
  # cache_control injection makes cached input ~4x cheaper; off-peak (incl.
  # weekends) is half credits. Plans: Lite 2k/5h + 10k/wk; Pro 12k/60k;
  # Max 28k/140k. Live windows show in the dashboard Quota tab.
  # ZCode campaign: traffic through ZCode parity converts at a 0.67 coefficient
  # (~1.5x quota) while it runs — subject to official announcement.
  # - cache_control injection → cache reads ~0.1x input
  # - fast mode + adaptive thinking (ZCode parity)
  # - 1s dispatch spacing → avoids 429 code 1302 rate limit
  - name: zai
    base_url: https://api.z.ai/api/anthropic
    wire: anthropic
    auth: { type: static, keys: ["..."] }
    models: [glm-5.3, glm-5.3-flash]
    dispatch_interval_ms: 1000
    dispatch_burst: 3               # immediate dispatch slots before spacing applies (0/1 = strict spacing); lets parallel agent fan-out through without weakening the sustained 1/s that avoids 1302
    skip_when_exhausted: false      # quota-aware routing: skip this provider while its billing windows report exhausted (fail-open)
    # headers_timeout_s: 60        # per-attempt wait for upstream response headers;
    #                               # lower it for providers that can stall long
    #                               # (the 120s Cloudflare window must fit failover)
    adaptive_thinking: true
    inject_cache_control: true
    extra_headers: { anthropic-beta: "fast-mode-2026-02-01" }
    body_overrides: { speed: fast }
    body_overrides_mode: fill        # fill (default): only set keys absent in client body; override: force e.g. { reasoning_effort: high }
    zcode_signing: true   # ZCode identity + Client-Signing V4; fail-open when the gate is off
    # rotation: round_robin        # rotate starting key/account per request
    #                              # (default first = config order; spreads quota)
  # subscription: goat            # curation guardrail: dashboard filters/expose-alls
    #                             # cap to this plan tier (""|goat|pro|max|free)
  # Full ZCode route (what the signed ZCode desktop hits today) — use this base
  # URL while chasing the 0.67 campaign coefficient; keep zcode_signing: true:
  #   base_url: https://zcode.z.ai/api/v1/ultra-zai/anthropic
  # Signing needs a two-part key ({id}.{secret}); single-part keys silently
  # send unsigned (matching the real client's fail-open).

  # --- Z.AI Start-Plan (free trial tokens, spent FIRST) ---
  # Key = the OAuth plan JWT (dashboard preset "Z.AI Start-Plan" has a
  # "log in with Z.ai" button that captures it; no client signing on this
  # gateway). Injects the ZCode system blocks the gateway requires (biz 3012
  # without them). Pair with the coding plan in a combo so an exhausted/
  # expired bucket (401/402/403) falls back automatically:
  #   combos:
  #     - name: glm-free-first
  #       model: glm-5.3-flash
  #       members: [{provider: zai-start}, {provider: zai}]
  - name: zai-start
    base_url: https://zcode.z.ai/api/v1/zcode-plan/anthropic
    wire: anthropic
    prefix: zai-start
    auth: { type: static, keys: ["<plan-jwt>"] }
    start_plan: true
    inject_cache_control: true
    models: [glm-5.3-flash, glm-5.3, glm-5.2, glm-5.1, glm-5, glm-5-turbo, glm-5v-turbo, glm-4.7, glm-4.6, glm-4.6v, glm-4.5-air]

  # --- OpenRouter (OpenAI wire, model ids like "deepseek/deepseek-chat") ---
  # Dashboard preset: one-click create. /models is public (catalog + live
  # pricing); GET /api/v1/credits feeds the Quota tab's credit balance.
  - name: openrouter
    base_url: https://openrouter.ai/api/v1
    wire: openai
    prefix: or
    auth: { type: static, keys: ["sk-or-..."] }
    models: [deepseek/deepseek-chat, deepseek/deepseek-r1]
  # Jev (System One decision model) rides the same OpenRouter key on the
  # classifier wire — /systemone, not /chat/completions. Jev is NOT in
  # OpenRouter's /models catalog, so the curated list is required.
  # - name: openrouter-classifier
  #   base_url: https://openrouter.ai/api/v1
  #   wire: classifier
  #   prefix: or
  #   auth: { type: static, keys: ["sk-or-..."] }
  #   models: [typesafe/jev-1.13, "~typesafe/jev-latest"]

  # --- TypeSafe System One direct (Jev decision model) ---
  # Same request shape as OpenRouter's classifier surface: POST
  # {base_url}/systemone with {model, state, questions}. $0.042/Mtok input,
  # output tokens free. Dashboard preset: one-click create.
  # - name: typesafe
  #   base_url: https://api.typesafe.ai/v1
  #   wire: classifier
  #   prefix: jev
  #   auth: { type: static, keys: ["ts-..."] }
  #   models: [jev-latest, jev-1.13.0]

  # --- Command Code Jev (decision model, GOAT+ plans) ---
  # $0.04/M input at cost, output free, same credits as chat models. Id is the
  # bare "typesafe/jev" and it is NOT in cmdcode's /models catalog — the
  # curated list is required. Dashboard preset: one-click create.
  # - name: cmdcode-classifier
  #   base_url: https://api.commandcode.ai/provider/v1
  #   wire: classifier
  #   prefix: cmd-jev
  #   auth: { type: static, keys: ["$CMD_API_KEY"] }
  #   models: [typesafe/jev]

  # --- Ollama Cloud (https://ollama.com) ---
  # Open models served from Ollama's cloud. Dashboard preset: one-click create.
  # /v1/models is public (catalog enriched from models.dev); GET /api/usage
  # feeds the Quota tab's session/weekly pct windows. Claude Code/Codex clients
  # work through yardmaster's wire translation.
  - name: ollama
    base_url: https://ollama.com/v1
    wire: openai
    prefix: ol
    auth: { type: static, keys: ["..."] }
    models: [glm-5.3, glm-5.3-flash, deepseek-v4.1-flash, kimi-k3, "gpt-oss:120b"]

  # --- Nvidia NIM (https://build.nvidia.com) ---
  # OpenAI-compatible gateway for Nemotron / Llama / GLM / Kimi / DeepSeek open
  # models. Free signup credits; most catalog models cost $0 — the dashboard's
  # "free" price filter lists them. /v1/models is public (catalog enriched
  # from models.dev "nvidia"). No usage API → no Quota tab entry.
  # - name: nvidia
  #   base_url: https://integrate.api.nvidia.com/v1
  #   wire: openai
  #   prefix: nv
  #   auth: { type: static, keys: ["nvapi-..."] }
  #   models: [z-ai/glm-5.3, z-ai/glm-5.3-flash, moonshotai/kimi-k3, deepseek-ai/deepseek-v4.1-flash]

  # --- OpenCode Go / OpenCode Zen (https://opencode.ai/zen) ---
  # One gateway, three wire families — add the entries you need (dashboard
  # presets do this in one click; `session: opencode` sends the required
  # x-opencode-session/client headers). zen/go/v1 bills the Go subscription's
  # per-model monthly limits and feeds the Quota tab's usage windows; use
  # https://opencode.ai/zen/v1 instead for pay-as-you-go Zen credits (no
  # usage API). Free models: big-pickle, nemotron-3-ultra-free,
  # mimo-v2.5-free, ling-3.0-flash-fin-free.
  - name: opencode-go            # DeepSeek/GLM/Kimi/MiniMax + free models
    base_url: https://opencode.ai/zen/go/v1
    wire: openai
    session: opencode
    auth: { type: static, keys: ["..."] }
    models: [deepseek-v4-flash, deepseek-v4-pro, glm-5.3, glm-5.3-flash, kimi-k3, minimax-m3]
  - name: opencode-go-claude     # Claude + Qwen family
    base_url: https://opencode.ai/zen/go/v1
    wire: anthropic
    session: opencode
    auth: { type: static, keys: ["..."] }
    models: [minimax-m2.7, minimax-m3, qwen3.7-plus, qwen3.8-max]
  # - name: opencode-go-gpt       # GPT + Grok family (responses wire)
  #   base_url: https://opencode.ai/zen/go/v1
  #   wire: responses
  #   session: opencode
  #   auth: { type: static, keys: ["..."] }
  #   models: [gpt-5.6-luna, grok-4.6, grok-4.7]

  # --- Command Code Provider API (both wires) ---
  # GOAT plan: open models on the openai wire. Claude models (Pro/Max) need the
  # anthropic wire — they serve /messages only.
  - name: cmdcode
    base_url: https://api.commandcode.ai/provider/v1
    wire: openai
    auth: { type: static, keys: ["..."] }
    models: [z-ai/glm-5.3-flash, zai-org/glm-5.3, MiniMaxAI/MiniMax-M3, deepseek/deepseek-v4.1-flash]
  # - name: cmdcode-claude       # Pro/Max plans: Claude on the anthropic wire
  #   base_url: https://api.commandcode.ai/provider/v1
  #   wire: anthropic
  #   auth: { type: static, keys: ["..."] }
  #   models: [claude-sonnet-5]

  # --- BigModel (CN) GLM Coding Plan, same method as zai ---
  # - name: bigmodel
  #   base_url: https://open.bigmodel.cn/api/anthropic
  #   wire: anthropic
  #   auth: { type: static, keys: ["..."] }
  #   models: [glm-5.3]
  #   dispatch_interval_ms: 1000
  #   adaptive_thinking: true
  #   inject_cache_control: true

  # --- Claude Code subscription (OAuth; import: yardmaster oauth import claude-code) ---
  # - name: claude-sub
  #   base_url: https://api.anthropic.com
  #   wire: anthropic
  #   auth:
  #     type: oauth
  #     oauth_accounts:
  #       - { name: claude-main, kind: claude-code, refresh_token: "..." }
  #   models: [claude-sonnet-5, claude-opus-5]

  # --- Codex/ChatGPT subscription (OAuth; import: yardmaster oauth import codex) ---
  # - name: codex-sub
  #   base_url: https://chatgpt.com/backend-api/codex
  #   wire: responses          # translated to openai/anthropic clients automatically
  #   auth:
  #     type: oauth
  #     oauth_accounts:
  #       - { name: codex-main, kind: codex, refresh_token: "...", account_id: "..." }
  #   models: [gpt-5.5]

  # --- Qwen Code subscription (OAuth; import: yardmaster oauth import qwen --refresh-token ...) ---
  # Qwen Code CLI login (qwen) leaves the refresh token in ~/.qwen/oauth_creds.json.
  # Response's resource_url is ignored — point base_url where you actually call.
  # - name: qwen-sub
  #   base_url: https://dashscope.aliyuncs.com/compatible-mode/v1
  #   wire: openai
  #   auth:
  #     type: oauth
  #     oauth_accounts:
  #       - { name: qwen-main, kind: qwen, refresh_token: "..." }
  #   models: [qwen3-coder-plus, qwen3-max]

  # --- GitHub Copilot subscription (token; import: yardmaster oauth import copilot --token ...) ---
  # refresh_token holds the long-lived GitHub access token (never refreshed);
  # each dispatch exchanges it for a short-lived Copilot token automatically.
  # - name: copilot-sub
  #   base_url: https://api.githubcopilot.com
  #   wire: openai             # anthropic shim: https://api.githubcopilot.com/v1/messages
  #   auth:
  #     type: oauth
  #     oauth_accounts:
  #       - { name: copilot-main, kind: copilot, refresh_token: "ghp_..." }
  #   models: [gpt-5.5]

  # --- Gemini API (gemini wire: POST {base}/v1beta/models/{model}:generateContent) ---
  # Static API key only today (sent as x-goog-api-key; aistudio.google.com → Get API key).
  # The gemini-cli OAuth kind exists as a refresh default only — its Code Assist
  # endpoint speaks a different (v1internal) API shape and is out of scope.
  # Gemini-native clients hit yardmaster at /v1beta/models/{model}[:streamGenerateContent?alt=sse].
  # - name: gemini
  #   base_url: https://generativelanguage.googleapis.com
  #   wire: gemini
  #   auth: { type: static, keys: ["AIza..."] }
  #   models: [gemini-3-pro, gemini-3-flash]
  #   # proxy_url: socks5://127.0.0.1:1080   # per-provider outbound proxy
  #   #                                      # (http|https|socks5) — upstream
  #   #                                      # dispatch only; oauth refresh,
  #   #                                      # quota windows, catalog fetches
  #   #                                      # stay direct

# -*- optional global routing defaults: every route/provider inherits these;
# per-route `strategy:` and per-provider `rotation:` override them.
# routing:
#   strategy: priority     # priority | weighted-rr
#   rotation: first        # first | round_robin
#   # session affinity: pin a coding-agent session to the provider+connection
#   # that served its first request so upstream prompt caches hit. Session id
#   # = first non-empty of the header below, the opencode session header,
#   # anthropic metadata.user_id, openai body "user".
#   # affinity:
#   #   enabled: true
#   #   ttl_s: 3600         # binding lifetime; 0 = default (3600)
#   #   header: x-session-id

routes:
  - match: "glm-*"
    chain: [zai]
  - match: "deepseek*"
    chain: [deepseek, openrouter]
    # strategy: inherit (default) | priority | weighted-rr — empty inherits global
    # weights: [3, 1]        # weighted-rr only, index-aligned with chain
  # Claude routing needs an active anthropic-wire provider — cmdcode-claude
  # (Pro/Max plans) and/or claude-sub. Uncomment one above, then:
  # - match: "claude-*"
  #   chain: [claude-sub, opencode-go-claude, cmdcode-claude]   # subscription first, then API-key fallback

# -*- combos: one virtual model id pooling models across providers.
# Requesting "combo/<name>" dispatches over the members in order (priority) or
# by weights (weighted-rr); the rest of each member's keys stay as fallbacks,
# and the usual failover/cooldown/rotation rules apply per member.
# Top-level `model` is optional: set it when every member serves the same
# natural id, or omit it and give each member its own `model` (required then).
# `type` is "chat" (default) or "decision" — a decision combo may only list
# classifier-wire providers and advertises on /v1/systemone/models instead of
# /v1/models. Member `keys` pins specific connections by label or oauth
# account name — omit for "all enabled keys, auto". Routing analytics (who
# served what, failover rate) live in the dashboard Combos tab.
# combos:
#   - name: deepseek-v4.1-flash          # exposed as combo/deepseek-v4.1-flash
#     model: deepseek-v4.1-flash
#     strategy: weighted-rr              # "" inherit | priority | weighted-rr
#     members:
#       - provider: opencode-go
#         model: deepseek-v4-flash       # opencode's id for the same model
#         weight: 3
#       - provider: cmdcode              # all keys, auto-select
#         model: deepseek/deepseek-v4.1-flash
#       - provider: deepseek
#         keys: [main]                   # pin one connection by label
# Decision-model combo (Jev across classifier providers) — no combo model:
#   - name: jev
#     type: decision
#     members:
#       - provider: typesafe
#         model: jev-latest
#       - provider: openrouter-classifier
#         model: typesafe/jev-1.13

# keys CLI agents authenticate with (yardmaster key add NAME generates one)
# usage: false revokes the key's access to GET /v1/usage (upstream provider
# usage report); unset/true = allowed (default).
# monthly_usd caps the key's calendar-month spend: month-to-date cost from the
# request log >= cap answers 429 budget_exceeded (+ Retry-After to month end);
# 0/unset = unlimited. count_tokens stays usable for context trimming.
keys:
  - key: "ar-REPLACE_ME"
    name: pi-laptop
    allow: ["*"]
    # monthly_usd: 20

# optional per-model cost overrides ($/Mtok); built-in defaults cover common models
costs:
  deepseek-flash: { input: 0.30, output: 1.20, cache_read: 0.006 }
