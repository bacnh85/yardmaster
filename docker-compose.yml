# Deploy yardmaster: cp config.example.yaml config.yaml (fill in keys), then:
#   docker compose up -d
services:
  yardmaster:
    image: ghcr.io/bacnh85/yardmaster:latest
    container_name: yardmaster
    ports:
      - "8787:8787"
    volumes:
      # errors clearly if config.yaml is missing, instead of docker creating a directory
      - type: bind
        source: ./config.yaml
        target: /data/config.yaml
        read_only: true
        create_host_path: false
      # named volume: seeds ownership from the image (uid 1000), no host chown needed
      - yardmaster-data:/data
    restart: unless-stopped
volumes:
  yardmaster-data: